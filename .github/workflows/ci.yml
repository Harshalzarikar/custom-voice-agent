name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s backend -p "test_*.py" -v
      - name: Import smoke test
        env:
          DATA_DIR: ${{ runner.temp }}/voice-data
          SESSION_SECRET: ci-session-secret
        run: python -c "import sys; sys.path.insert(0, 'backend'); import main, agent_worker; print('imports ok')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
