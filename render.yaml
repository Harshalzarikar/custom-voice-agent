services:
  # FastAPI plus the LiveKit agent worker. Free instances sleep when idle,
  # which drops live calls. Use a paid instance once this takes real traffic.
  - type: web
    name: vocal-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python agent_worker.py download-files"
    startCommand: "bash start.sh"
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: ENABLE_DEMO_TRIGGERS
        value: "false"
      - key: WORKER_IDLE_PROCESSES
        value: "1"
      - key: FRONTEND_URL
        fromService:
          name: vocal-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  - type: web
    name: vocal-frontend
    runtime: static
    buildCommand: "yarn install --frozen-lockfile && yarn build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: vocal-backend
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
